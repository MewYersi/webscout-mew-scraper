<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Valoracion Deportiva - SVD</title>
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>
<body class="relative bg-brand-dark"> <aside class="w-24 h-full py-6 pl-6 flex flex-col hidden lg:flex z-20">
        <div class="glass-panel w-full h-full flex flex-col items-center py-10 justify-between">
            
            <div class="w-12 h-12 bg-gradient-to-br from-brand-pink to-brand-accent rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(214,64,159,0.3)] cursor-pointer transition-transform hover:scale-110">
                <i class="ph-fill ph-soccer-ball text-2xl text-white"></i>
            </div>

            <nav class="flex flex-col gap-6">
                <a href="{{ url_for('dashboard') }}" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all 
                    {% if request.endpoint == 'dashboard' %}nav-active{% else %}text-white/40 hover:text-white hover:bg-white/10{% endif %}">
                    <i class="ph-bold ph-house text-xl"></i>
                </a>

                <a href="{{ url_for('players') }}" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all 
                    {% if request.endpoint == 'players' or request.endpoint == 'player_profile' %}nav-active{% else %}text-white/40 hover:text-white hover:bg-white/10{% endif %}">
                    <i class="ph-bold ph-users text-xl"></i>
                </a>

                <a href="#" class="w-12 h-12 rounded-2xl flex items-center justify-center text-white/40 hover:text-white hover:bg-white/10 transition-all">
                    <i class="ph-bold ph-flask text-xl"></i>
                </a>

                <a href="{{ url_for('compare') }}" class="w-12 h-12 rounded-2xl flex items-center justify-center transition-all 
    {% if request.endpoint == 'compare' %}nav-active{% else %}text-white/40 hover:text-white hover:bg-white/10{% endif %}"> 
    <i class="ph-bold ph-flask text-xl"></i> 
</a>

            </nav>

            <div class="w-10 h-10 rounded-full overflow-hidden border border-white/20 cursor-pointer hover:border-brand-pink transition-colors opacity-70 hover:opacity-100">
                <img src="https://ui-avatars.com/api/?name=Mew+User&background=random&color=fff" alt="User" class="w-full h-full object-cover">
            </div>

        </div>
    </aside>

    <div class="flex-1 h-full z-10">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
