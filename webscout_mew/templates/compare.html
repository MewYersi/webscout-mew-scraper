{% extends 'base.html' %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<main class="flex-1 h-full flex flex-col relative overflow-hidden">
    <div class="flex-1 overflow-y-auto no-scrollbar p-6 flex flex-col gap-6 z-10">
        
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row justify-between items-center gap-4 shrink-0">
            <div>
                <h1 class="text-3xl font-black tracking-tight text-[#360568]">Scouting: Comparativa Avanzada</h1>
                <p class="text-[#496A81] text-sm mt-1 font-bold">Evalúa jugadores vs Población Continental</p>
            </div>
            <div class="glass-panel h-12 px-4 !rounded-full flex items-center gap-2 relative z-20">
                <i class="ph-bold ph-calendar text-[#496A81]"></i>
                <select id="seasonSelect" class="bg-transparent appearance-none outline-none text-[#360568] text-sm cursor-pointer pr-4 font-black">
                    {% for t in temporadas %}
                        <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
        </header>

        <!-- SLOTS DE JUGADORES -->
        <div id="player-slots-container" class="grid grid-cols-2 lg:grid-cols-4 gap-4 shrink-0 animate-fade-in">
        </div>

        <!-- TABS -->
        <div class="flex gap-4 border-b border-white/60 shrink-0 mb-2">
            <button onclick="switchTab('radar')" id="btnTabRadar" class="pb-3 text-sm font-black text-[#360568] border-b-2 border-[#360568] transition-all">
                <i class="ph-bold ph-radar mr-1"></i> Radar de Contexto
            </button>
            <button onclick="switchTab('scatter')" id="btnTabScatter" class="pb-3 text-sm font-bold text-slate-400 hover:text-[#496A81] transition-all">
                <i class="ph-bold ph-chart-scatter mr-1"></i> Cazador (Scatter)
            </button>
        </div>

        <!-- TAB 1: RADAR (SISTEMA BENTO GRID) -->
        <div id="tabRadar" class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1 min-h-0 animate-fade-in">
            
            <!-- Columna Izquierda: Radar Gráfico (Fondo Oscuro Indigo) -->
            <div class="lg:col-span-4 flex flex-col gap-6">
                <!-- Cambiamos el glass-panel por un panel oscuro y elegante -->
                <div class="bg-gradient-to-b from-[#360568] to-[#1e0338] rounded-[2rem] p-6 flex flex-col flex-1 min-h-[500px] relative shadow-[0_15px_35px_rgba(54,5,104,0.3)] border border-white/10">
                    
                    <div class="flex justify-between items-center z-10 mb-4 border-b border-white/10 pb-4">
                        <h3 class="text-sm font-black text-[#FFC482] uppercase tracking-widest flex items-center gap-2">
                            <i class="ph-fill ph-radar"></i> Matriz Táctica
                        </h3>
                    </div>
                    
                    <!-- Píldora del selector integrada al panel oscuro -->
                    <div class="relative w-full bg-white/5 rounded-xl border border-white/10 p-1 transition-all hover:bg-white/10 shadow-sm z-10 mb-2">
                        <select id="templateSelect" disabled class="w-full bg-transparent px-3 py-2 text-[#66999B] text-xs font-black outline-none cursor-pointer disabled:opacity-30 disabled:cursor-not-allowed appearance-none text-center tracking-widest uppercase">
                            <option value="completo">Análisis Completo</option>
                            <option value="opcion1">Opción 1</option>
                            <option value="opcion2">Opción 2</option>
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-4 top-3 text-[#66999B] text-[10px] pointer-events-none"></i>
                    </div>
                    
                    <div class="relative w-full flex-1 min-h-[300px] mx-auto mt-4 mb-8 flex items-center justify-center">
                        <canvas id="contextRadar"></canvas>
                    </div>

                    <!-- Leyenda movida al pie -->
                    <div id="contextInfo" class="mt-auto text-center text-[9px] text-[#496A81] font-black uppercase tracking-widest border-t border-white/10 pt-4 hidden"></div>
                </div>
            </div>

            <!-- Columna Derecha: Sistema Bento Grid -->
            <div class="lg:col-span-8 flex flex-col h-full lg:h-auto overflow-hidden relative">
                
                <div class="flex justify-between items-center mb-6 shrink-0 z-10 px-2">
                    <h3 class="text-xl font-black text-[#360568] flex items-center gap-2">
                        <i class="ph-fill ph-circles-four text-[#496A81]"></i> Desglose de Percentiles
                    </h3>
                </div>

                <!-- Bento Container (Grid de 2 columnas) -->
                <div id="stats-breakdown-container" class="flex-1 overflow-y-auto no-scrollbar pb-6 grid grid-cols-1 md:grid-cols-2 gap-4 auto-rows-max items-start">
                    
                    <div class="col-span-full flex flex-col items-center justify-center h-64 text-slate-400 mt-10 glass-panel rounded-3xl">
                        <i class="ph-duotone ph-users-three text-6xl mb-4 text-[#496A81]/50"></i>
                        <p class="text-sm font-black text-[#360568] uppercase tracking-widest">Añade jugadores para iniciar</p>
                    </div>

                </div>
            </div>
        </div>

        <!-- TAB 2: SCATTER -->
        <div id="tabScatter" class="hidden flex-col animate-fade-in space-y-8 h-auto pb-10">
            <div class="glass-panel p-5 rounded-[1.5rem] flex flex-wrap gap-5 items-center shrink-0 border-t border-white/60 z-20 shadow-sm">
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black text-[#496A81] uppercase">Eje X:</span>
                    <select id="scatterX" class="bg-white/50 border border-white/60 rounded-lg px-2 py-1.5 text-xs text-slate-800 outline-none w-40 cursor-pointer shadow-sm">
                        {% for s in stats_list %}<option value="{{ s.key }}" {% if s.key == 'xG' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-black text-[#360568] uppercase">Eje Y:</span>
                    <select id="scatterY" class="bg-white/50 border border-white/60 rounded-lg px-2 py-1.5 text-xs text-slate-800 outline-none w-40 cursor-pointer shadow-sm">
                        {% for s in stats_list %}<option value="{{ s.key }}" {% if s.key == 'Gls' %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
                    </select>
                </div>
                <div class="w-px h-8 bg-slate-300 mx-2 hidden md:block"></div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Posición:</span>
                    <select id="scatterRol" class="bg-white/50 border border-white/60 rounded-lg px-2 py-1.5 text-xs text-slate-800 outline-none cursor-pointer shadow-sm">
                        <option value="ALL">Todas</option><option value="FW">Atacantes (FW)</option><option value="AM">Mediapuntas (AM)</option><option value="MC">Mediocentros (MC)</option><option value="DF">Defensas (DF/LB)</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">Min. Minutos:</span>
                    <input type="number" id="scatterMinutos" value="500" step="100" class="bg-white/50 border border-white/60 rounded-lg px-2 py-1.5 text-xs text-slate-800 w-20 outline-none text-center shadow-sm">
                </div>
                <button onclick="loadScatterData()" class="ml-auto bg-[#360568] hover:bg-[#360568]/90 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-all shadow-md">
                    <i class="ph-bold ph-arrows-clockwise mr-1"></i> Analizar
                </button>
            </div>
            
            <!-- Título del Scatter -->
            <div class="glass-panel flex-1 rounded-[2rem] p-8 relative flex flex-col min-h-[700px] shadow-sm mb-6">
                <h3 class="text-sm font-black text-[#360568] uppercase tracking-wider flex items-center gap-2 mb-4 shrink-0">
                    <i class="ph-bold ph-chart-scatter text-[#66999B]"></i> Matriz de Dispersión
                    <span id="scatterPoblacion" class="text-[10px] font-bold text-[#496A81] ml-2 bg-white/60 px-2 py-0.5 rounded-full border border-white"></span>
                </h3>
                <div class="relative flex-1 w-full h-full">
                    <canvas id="scatterChart"></canvas>
                    <div id="scatterTooltip" class="absolute pointer-events-none opacity-0 transition-opacity duration-200 z-50 glass-panel border border-white/60 rounded-xl p-3 shadow-lg flex flex-col gap-2 w-52" style="transform: translate(-50%, -100%); margin-top: -15px;"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- SEARCH MODAL -->
<div id="searchModal" class="fixed inset-0 bg-slate-900/30 backdrop-blur-md z-50 hidden flex flex-col items-center pt-32 px-4 transition-opacity opacity-0">
    <div class="w-full max-w-2xl flex flex-col gap-4 relative">
        <button onclick="closeSearchModal()" class="absolute -top-12 right-0 text-white/70 hover:text-white text-3xl transition-colors"><i class="ph-bold ph-x"></i></button>
        
        <div class="bg-white/80 backdrop-blur-xl h-16 w-full rounded-2xl flex items-center px-6 gap-4 shadow-xl border border-white focus-within:ring-2 focus-within:ring-[#66999B] transition-all">
            <i class="ph-bold ph-magnifying-glass text-2xl text-[#496A81]"></i>
            <input type="text" id="modalSearchInput" placeholder="Busca un jugador para comparar..." autocomplete="off" class="bg-transparent border-none outline-none text-[#360568] placeholder-slate-400 w-full h-full text-xl font-bold">
        </div>

        <div id="modalSearchResults" class="bg-white/80 backdrop-blur-xl rounded-2xl overflow-hidden shadow-xl border border-white hidden flex-col"></div>
        
        <div id="modalSuggestions" class="mt-4 hidden animate-fade-in flex flex-col items-center w-full">
            <span class="text-xs font-bold text-slate-800 bg-white/60 px-3 py-1 rounded-full uppercase tracking-wider mb-3 shadow-sm border border-white">Sugerencias por Similitud</span>
            <div id="modalSuggestionsList" class="flex flex-wrap justify-center gap-2 max-h-[300px] overflow-y-auto no-scrollbar w-full p-2"></div>
        </div>
    </div>
</div>

<script>
// Variables Globales
let compareList = []; 
const MAX_PLAYERS = 4;

// 1. Paleta de colores SVD oficial
const playerColors = [
    { hex: '#FFC482', bg: 'rgba(255, 196, 130, 0.2)' },// Jugador 1: Peach Glow
    { hex: '#66999B', bg: 'rgba(102, 153, 155, 0.2)' },// Jugador 2: Pacific Blue
    { hex: '#B3AF8F', bg: 'rgba(179, 175, 143, 0.2)' }, // Jugador 3: Dry Sage
    { hex: '#496A81', bg: 'rgba(73, 106, 129, 0.2)' }   // Jugador 4: Blue Slate
];

function switchTab(tab) {
    document.getElementById('tabRadar').classList.toggle('hidden', tab !== 'radar');
    document.getElementById('tabScatter').classList.toggle('hidden', tab !== 'scatter');
    document.getElementById('btnTabRadar').className = tab === 'radar' ? "pb-3 text-sm font-black text-[#360568] border-b-2 border-[#360568] transition-all" : "pb-3 text-sm font-bold text-slate-400 hover:text-[#496A81] transition-all";
    document.getElementById('btnTabScatter').className = tab === 'scatter' ? "pb-3 text-sm font-black text-[#360568] border-b-2 border-[#360568] transition-all" : "pb-3 text-sm font-bold text-slate-400 hover:text-[#496A81] transition-all";
}

document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('contextRadar').getContext('2d');
    
    // Configuración para que Chart.js se vea bien sobre fondo oscuro
    Chart.defaults.color = 'rgba(255, 255, 255, 0.6)'; 
    Chart.defaults.font.family = "'Outfit', sans-serif";
    
    let radarChart = null;
    let suggestedRivals = [];

    const seasonSelect = document.getElementById('seasonSelect');
    const templateSelect = document.getElementById('templateSelect');
    const searchModal = document.getElementById('searchModal');
    const modalSearchInput = document.getElementById('modalSearchInput');
    const modalSearchResults = document.getElementById('modalSearchResults');
    let searchTimeout;

    window.openSearchModal = function() {
        if (compareList.length >= MAX_PLAYERS) return;
        searchModal.classList.remove('hidden');
        setTimeout(() => { searchModal.classList.remove('opacity-0'); modalSearchInput.focus(); }, 10);
        renderSuggestionsInModal();
    };

    window.closeSearchModal = function() {
        searchModal.classList.add('opacity-0');
        setTimeout(() => { searchModal.classList.add('hidden'); modalSearchInput.value = ''; modalSearchResults.innerHTML = ''; modalSearchResults.classList.add('hidden'); }, 300);
    };

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearchModal(); });

    function renderSlots() {
        const container = document.getElementById('player-slots-container');
        container.innerHTML = '';
        
        for (let i = 0; i < MAX_PLAYERS; i++) {
            if (i < compareList.length) {
                const p = compareList[i];
                const colorHex = playerColors[i].hex;
                container.innerHTML += `
                    <div class="glass-panel p-3 rounded-2xl border border-white/60 flex items-center justify-between shadow-sm relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-2" style="background-color: ${colorHex}"></div>
                        <div class="flex items-center gap-3 pl-3 w-full">
                            <img src="https://ui-avatars.com/api/?name=${p.data.nombre}&background=F4F1EA&color=360568&bold=true" class="w-10 h-10 rounded-full border border-white shadow-sm shrink-0">
                            <div class="min-w-0 flex-1">
                                <p class="text-sm font-bold text-[#360568] truncate leading-tight">${p.data.nombre}</p>
                                <p class="text-[10px] font-bold text-[#496A81] truncate leading-tight uppercase tracking-wider">${p.data.club}</p>
                            </div>
                            <button onclick="removePlayer(${p.id})" class="w-8 h-8 rounded-full bg-white/50 flex items-center justify-center text-[#496A81] hover:bg-[#360568] hover:text-white transition-colors shrink-0 border border-white">
                                <i class="ph-bold ph-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML += `
                    <button onclick="openSearchModal()" class="glass-panel p-3 rounded-2xl border border-dashed border-white hover:border-[#66999B] hover:bg-white/50 flex flex-col items-center justify-center gap-1 transition-all h-[66px] opacity-60 hover:opacity-100 shadow-sm">
                        <i class="ph-bold ph-plus text-lg text-[#496A81]"></i>
                        <span class="text-[10px] font-bold text-[#360568] uppercase">Añadir Jugador</span>
                    </button>
                `;
            }
        }
    }

    seasonSelect.addEventListener('change', () => {
        compareList = [];
        suggestedRivals = [];
        if (radarChart) radarChart.destroy();
        document.getElementById('stats-breakdown-container').innerHTML = '<div class="col-span-full flex flex-col items-center justify-center h-64 text-slate-400 mt-10 glass-panel rounded-3xl"><i class="ph-duotone ph-users-three text-6xl mb-4 text-[#496A81]/50"></i><p class="text-sm font-black text-[#360568] uppercase tracking-widest">Añade jugadores para iniciar</p></div>';
        document.getElementById('contextInfo').classList.add('hidden');
        templateSelect.disabled = true;
        renderSlots();
    });

    templateSelect.addEventListener('change', () => {
        if (compareList.length > 0) {
            const currentTemplate = templateSelect.value;
            Promise.all(compareList.map(p => 
                fetch(`/api/radar_contexto/${p.id}?plantilla=${currentTemplate}`).then(r => r.json())
            )).then(results => {
                results.forEach((data, index) => { compareList[index].data = data; });
                renderView();
            });
        }
    });

    modalSearchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        const q = this.value.trim();
        const season = seasonSelect.value;
        let exactRole = '';
        
        if (compareList.length > 0) exactRole = compareList[0].data.rol;
        
        if (q.length < 2) { modalSearchResults.classList.add('hidden'); return; }

        searchTimeout = setTimeout(() => {
            fetch(`/api/buscar_jugador?q=${q}&temporada=${season}&rol_exacto=${exactRole}`)
                .then(res => res.json())
                .then(data => {
                    modalSearchResults.innerHTML = '';
                    if (data.length === 0) {
                        modalSearchResults.innerHTML = '<div class="p-6 text-sm text-[#496A81] font-bold text-center">No encontramos a ese jugador, o no pertenece a este rol exacto.</div>';
                    } else {
                        data.forEach(j => {
                            const div = document.createElement('div');
                            div.className = 'p-4 hover:bg-[#66999B]/10 cursor-pointer border-b border-white/60 flex justify-between items-center transition-colors group';
                            div.innerHTML = `
                                <div>
                                    <p class="text-base font-black text-[#360568] group-hover:text-[#66999B] transition-colors">${j.nombre}</p>
                                    <p class="text-xs font-bold text-[#496A81] uppercase tracking-wider">${j.club}</p>
                                </div>
                                <span class="text-[10px] bg-white/60 px-2 py-1 rounded font-black text-[#496A81] border border-white shadow-sm">${j.rol}</span>
                            `;
                            div.onclick = () => {
                                const currentTemplate = compareList.length > 0 ? templateSelect.value : 'completo';
                                loadPlayerContext(j.id, currentTemplate);
                            };
                            modalSearchResults.appendChild(div);
                        });
                    }
                    modalSearchResults.classList.remove('hidden');
                });
        }, 300);
    });

    window.loadPlayerContext = function(id, plantilla) {
        if (compareList.length >= MAX_PLAYERS) return;
        if (compareList.find(p => p.id === id)) { closeSearchModal(); return alert("El jugador ya está en la comparativa."); }
        
        closeSearchModal();
        
        fetch(`/api/radar_contexto/${id}?plantilla=${plantilla}`)
            .then(res => res.json())
            .then(data => {
                if (compareList.length > 0 && data.rol !== compareList[0].data.rol) {
                    return alert(`Solo puedes evaluar perfiles exactos. Tu base es de rol: ${compareList[0].data.rol}`);
                }

                compareList.push({ id: id, data: data });

                if (compareList.length === 1) {
                    updateTemplateOptions(data.prefijo_rol);
                    templateSelect.disabled = false;
                    templateSelect.value = 'completo'; 
                    fetchSuggestions(id);
                }
                
                renderSlots();
                renderView();
            });
    }

    window.removePlayer = function(id) {
        compareList = compareList.filter(p => p.id !== id);
        renderSlots();
        
        if (compareList.length === 0) {
            suggestedRivals = [];
            if (radarChart) radarChart.destroy();
            document.getElementById('stats-breakdown-container').innerHTML = '<div class="col-span-full flex flex-col items-center justify-center h-64 text-slate-400 mt-10 glass-panel rounded-3xl"><i class="ph-duotone ph-users-three text-6xl mb-4 text-[#496A81]/50"></i><p class="text-sm font-black text-[#360568] uppercase tracking-widest">Añade jugadores para iniciar</p></div>';
            document.getElementById('contextInfo').classList.add('hidden');
            templateSelect.disabled = true;
        } else {
            renderView();
        }
    };

    function fetchSuggestions(basePlayerId) {
        fetch(`/api/rivales_similares/${basePlayerId}`)
            .then(res => res.json())
            .then(data => {
                suggestedRivals = data;
            });
    }

    function renderSuggestionsInModal() {
        const container = document.getElementById('modalSuggestions');
        const list = document.getElementById('modalSuggestionsList');
        list.innerHTML = '';

        if (compareList.length === 0 || compareList.length >= MAX_PLAYERS) {
            container.classList.add('hidden');
            return;
        }

        const availableSuggestions = suggestedRivals.filter(s => !compareList.some(p => p.id === s.id));

        if (availableSuggestions.length === 0) {
            container.classList.add('hidden');
            return;
        }

        availableSuggestions.forEach(s => {
            list.innerHTML += `
                <button onclick="loadPlayerContext(${s.id}, document.getElementById('templateSelect').value)" 
                        class="bg-white/80 backdrop-blur-md px-4 py-2 flex flex-col items-center gap-1 rounded-xl border border-white hover:border-[#66999B] hover:bg-white transition-all shrink-0 shadow-sm">
                    <span class="text-xs font-black text-[#360568]">${s.nombre.split(' ').slice(-2).join(' ')}</span>
                    <span class="text-[10px] text-[#FFC482] font-mono font-black drop-shadow-sm"><i class="ph-fill ph-star"></i> ${s.rtg}</span>
                </button>
            `;
        });
        container.classList.remove('hidden');
    }

    function updateTemplateOptions(prefijo) {
        const opts = templateSelect.options;
        if (prefijo === 'FW') { 
            opts[1].text = "Finalización"; opts[2].text = "Creación / Desborde"; 
        } else if (prefijo === 'MC' || prefijo === 'AM') { 
            opts[1].text = "Pase"; opts[2].text = "Acciones Defensivas"; 
        } else { 
            opts[1].text = "Salida de Balón"; opts[2].text = " Acciones Defensivas"; 
        }
    }

    function renderView() {
        const baseData = compareList[0].data;
        const infoDiv = document.getElementById('contextInfo');
        infoDiv.innerHTML = `${baseData.poblacion} ${baseData.rol} evaluados a nivel continental`;
        infoDiv.classList.remove('hidden');

        renderContextRadar(baseData);
        renderContextTable(baseData); // Esta función es la que construirá el Bento Grid
    }

    function renderContextRadar(baseData) {
        const labels = baseData.stats.map(s => s.label);
        let datasets = [];

        compareList.forEach((p, index) => {
            let dataJugador = p.data.stats.map(s => s.perc_jugador);
            datasets.push({
                label: p.data.nombre,
                data: dataJugador,
                backgroundColor: 'transparent',
                borderColor: playerColors[index].hex,
                borderWidth: 3,
                pointBackgroundColor: playerColors[index].hex,
                pointBorderColor: '#1e0338', // Borde oscuro para resaltar en el fondo
                pointHoverRadius: 6,
                fill: false
            });
        });

        if (radarChart) radarChart.destroy();

        radarChart = new Chart(ctx, {
            type: 'radar',
            data: { labels: labels, datasets: datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    r: {
                        angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                        grid: { color: 'rgba(255, 255, 255, 0.1)' },
                        pointLabels: { font: { size: 10, weight: '600', family: "'Outfit', sans-serif" }, color: 'rgba(255, 255, 255, 0.8)' },
                        ticks: { display: false, min: 0, max: 100 }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const statIndex = context.dataIndex;
                                const dsIndex = context.datasetIndex;
                                
                                if (dsIndex < compareList.length) {
                                    const pStat = compareList[dsIndex].data.stats[statIndex];
                                    return `${compareList[dsIndex].data.nombre}: ${pStat.raw_jugador.toFixed(2)} (P${pStat.perc_jugador})`;
                                }
                            }
                        }
                    }
                }
            }
        });
    }

    // ==========================================
    // SISTEMA BENTO GRID PARA STATS
    // ==========================================
    function renderContextTable(baseData) {
        const container = document.getElementById('stats-breakdown-container');
        container.innerHTML = '';
        
        if (!baseData.role_stats || baseData.role_stats.length === 0) return;

        // Por cada estadística, creamos una tarjeta de Bento
        baseData.role_stats.forEach((statObj) => {
            const statKey = statObj.key;

            let playersHtml = compareList.map((p, pIndex) => {
                const pStat = p.data.role_stats.find(s => s.key === statKey) || { raw_jugador: 0, perc_jugador: 0 };
                const colorHex = playerColors[pIndex].hex;
                
                return `
                    <div class="flex items-center justify-between mb-3 w-full group">
                        
                        <div class="flex items-center gap-2 w-32 shrink-0">
                            <span class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${colorHex};"></span>
                            <span class="text-[11px] font-bold text-[#360568] truncate" title="${p.data.nombre}">${p.data.nombre}</span>
                        </div>
                        
                        <div class="flex-1 px-4 relative flex items-center justify-end group-hover:scale-[1.02] transition-transform origin-right">
                            <div class="w-full h-1.5 bg-[#496A81]/10 rounded-full overflow-hidden absolute right-4 top-1/2 -translate-y-1/2 border border-white/50">
                                <div class="h-full rounded-full transition-all duration-1000 ease-out" style="width: ${pStat.perc_jugador}%; background-color: ${colorHex};"></div>
                            </div>
                        </div>

                        <div class="w-10 text-right shrink-0">
                            <span class="text-xs font-black text-[#360568]">${pStat.raw_jugador.toFixed(2).replace(/\.00$/, '')}</span>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML += `
                <div class="glass-panel p-5 rounded-3xl flex flex-col shadow-sm border border-white/80 hover:shadow-md transition-shadow">
                    <h4 class="text-[10px] font-black text-[#496A81] uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="ph-bold ph-chart-line-up text-[#66999B]"></i> ${statObj.label}
                    </h4>
                    <div class="flex flex-col w-full">${playersHtml}</div>
                </div>
            `;
        });
    }

    // --- LOGICA DE SCATTER CHART (SE MANTIENE IGUAL, SOLO COLORES) ---
    let scatterChart = null;

    const crosshairPlugin = {
        id: 'crosshair',
        afterDatasetsDraw: (chart) => {
            if (chart.config.type !== 'scatter') return;
            
            const {ctx, chartArea: {top, bottom, left, right}, scales: {x, y}} = chart;
            const data = chart.data.datasets[0].data;
            if(data.length === 0) return;
            
            const avgX = data.reduce((sum, d) => sum + d.x, 0) / data.length;
            const avgY = data.reduce((sum, d) => sum + d.y, 0) / data.length;
            
            const xPos = x.getPixelForValue(avgX);
            const yPos = y.getPixelForValue(avgY);

            ctx.save();
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(54, 5, 104, 0.2)'; // Punteado Indigo
            ctx.setLineDash([4, 4]);

            if (xPos >= left && xPos <= right) { ctx.moveTo(xPos, top); ctx.lineTo(xPos, bottom); }
            if (yPos >= top && yPos <= bottom) { ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); }
            
            ctx.stroke();
            ctx.restore();

            ctx.fillStyle = 'rgba(73, 106, 129, 0.8)'; // Texto Blue Slate
            ctx.font = '9px Outfit';
            ctx.fillText(`Promedio X: ${avgX.toFixed(2)}`, xPos + 5, bottom - 5);
            ctx.fillText(`Promedio Y: ${avgY.toFixed(2)}`, left + 5, top + 15);
        }
    };

    Chart.register(crosshairPlugin);

    const externalTooltipHandler = (context) => {
        const {chart, tooltip} = context;
        const tooltipEl = document.getElementById('scatterTooltip');

        if (tooltip.opacity === 0) { tooltipEl.style.opacity = 0; return; }

        if (tooltip.body) {
            const p = tooltip.dataPoints[0].raw;
            const xLabel = document.getElementById('scatterX').options[document.getElementById('scatterX').selectedIndex].text;
            const yLabel = document.getElementById('scatterY').options[document.getElementById('scatterY').selectedIndex].text;

            tooltipEl.innerHTML = `
                <div class="flex items-center gap-3 border-b border-white/60 pb-2 mb-2">
                    <img src="https://ui-avatars.com/api/?name=${p.nombre}&background=F4F1EA&color=360568&bold=true" class="w-8 h-8 rounded-full border border-white shadow-sm">
                    <div class="flex flex-col min-w-0">
                        <span class="text-xs font-black text-[#360568] leading-tight truncate">${p.nombre}</span>
                        <span class="text-[9px] font-bold text-[#496A81] uppercase leading-tight truncate">${p.club}</span>
                    </div>
                </div>
                <div class="flex justify-between items-center text-[10px] mb-1">
                    <span class="text-[#FFC482] font-black bg-white/60 px-1.5 py-0.5 rounded border border-white shadow-sm"><i class="ph-fill ph-star"></i> ${p.rtg} RTG</span>
                    <span class="bg-white/60 px-1.5 py-0.5 rounded font-black text-[#496A81] border border-white shadow-sm">${p.rol}</span>
                </div>
                <div class="flex flex-col gap-1 mt-2 text-[10px] font-mono bg-white/40 p-2 rounded-lg border border-white/60 shadow-sm">
                    <div class="flex justify-between items-center"><span class="text-[#496A81] font-bold truncate mr-2">${xLabel}:</span> <span class="text-[#360568] font-black">${p.x.toFixed(2)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-[#496A81] font-bold truncate mr-2">${yLabel}:</span> <span class="text-[#360568] font-black">${p.y.toFixed(2)}</span></div>
                </div>
                <div class="text-[8px] text-center text-[#66999B] font-bold mt-2 uppercase tracking-widest">Clic para analizar</div>
            `;
        }

        const {offsetLeft: positionX, offsetTop: positionY} = chart.canvas;
        tooltipEl.style.opacity = 1;
        tooltipEl.style.left = positionX + tooltip.caretX + 'px';
        tooltipEl.style.top = positionY + tooltip.caretY + 'px';
    };

    window.loadScatterData = function() {
        const xVal = document.getElementById('scatterX').value;
        const yVal = document.getElementById('scatterY').value;
        const rol = document.getElementById('scatterRol').value;
        const min = document.getElementById('scatterMinutos').value;
        const season = document.getElementById('seasonSelect').value;

        const xLabel = document.getElementById('scatterX').options[document.getElementById('scatterX').selectedIndex].text;
        const yLabel = document.getElementById('scatterY').options[document.getElementById('scatterY').selectedIndex].text;

        fetch(`/api/scatter_data?x=${xVal}&y=${yVal}&rol=${rol}&minutos=${min}&temporada=${season}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('scatterPoblacion').innerText = `(${data.length} jugadores)`;
                if (scatterChart) scatterChart.destroy();

                const sCtx = document.getElementById('scatterChart').getContext('2d');
                scatterChart = new Chart(sCtx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'Jugadores', data: data,
                            backgroundColor: 'rgba(102, 153, 155, 0.75)', borderColor: '#66999B', // Pacific Blue
                            borderWidth: 1, pointRadius: 5, pointHoverRadius: 8,
                            hoverBackgroundColor: '#360568', hoverBorderColor: '#fff' // Indigo Hover
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        onClick: (e, elements) => {
                            if (elements.length > 0) {
                                const player = scatterChart.data.datasets[0].data[elements[0].index];
                                switchTab('radar');
                                const currentTemplate = compareList.length > 0 ? document.getElementById('templateSelect').value : 'completo';
                                loadPlayerContext(player.id, currentTemplate);
                            }
                        },
                        scales: {
                            x: { 
                                title: { display: true, text: xLabel, color: 'rgba(54, 5, 104, 0.8)', font: { size: 12, weight: 'bold' } }, 
                                grid: { color: 'rgba(54, 5, 104, 0.08)' }, 
                                ticks: { color: 'rgba(73, 106, 129, 0.8)', font: { size: 11, weight: 'bold' } } 
                            },
                            y: { 
                                title: { display: true, text: yLabel, color: 'rgba(54, 5, 104, 0.8)', font: { size: 12, weight: 'bold' } }, 
                                grid: { color: 'rgba(54, 5, 104, 0.08)' }, 
                                ticks: { color: 'rgba(73, 106, 129, 0.8)', font: { size: 11, weight: 'bold' } } 
                            }
                        },
                        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltipHandler, mode: 'nearest', intersect: true } }
                    }
                });
            });
    };

    setTimeout(() => { if(document.getElementById('tabScatter')) loadScatterData(); renderSlots(); }, 500);

});
</script>
